name: Release

# Publica un release solo cuando main recibe un merge de release/* (GitFlow).
# El gate de calidad ya corrió en CI; acá se construye el binario y se taggea.
on:
  push:
    branches: [main]

jobs:
  tag-release:
    name: Tag semantic release
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'release:')
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: semver
        name: Parse version from commit message
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "v0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build binary matrix
    runs-on: ubuntu-latest
    needs: tag-release
    strategy:
      matrix:
        target: [bun-linux-x64, bun-linux-x64-baseline, bun-darwin-arm64, bun-windows-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build binary (${{ matrix.target }})
        run: |
          bun build --compile --minify --bytecode \
            --target=${{ matrix.target }} \
            ./src/cli.ts --outfile dist/netrunner-${{ matrix.target }}

      - name: Upload binary (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: netrunner-${{ matrix.target }}
          path: dist/netrunner-${{ matrix.target }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [tag-release, build-binaries]
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-release.outputs.version }}
          generate_release_notes: true
          files: release-assets/**/*
